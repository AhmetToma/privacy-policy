<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <meta name="description" content="صفحة واحدة، كلمة واحدة." />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <button
      class="theme-toggle"
      type="button"
      id="theme-toggle"
      aria-label="تبديل الوضع الداكن"
      title="تبديل الوضع الداكن"
    >
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2" />
        <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </svg>
    </button>

    <main class="stage">
      <h1 class="word">شكارك</h1>
    </main>

    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById("theme-toggle");
        var media = window.matchMedia("(prefers-color-scheme: dark)");

        function current() {
          var set = root.getAttribute("data-theme");
          if (set) return set;
          return media.matches ? "dark" : "light";
        }

        btn.addEventListener("click", function () {
          var next = current() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
